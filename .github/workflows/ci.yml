name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cvolution
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cvolution/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The applications DB tests start a throwaway PostgreSQL cluster with
      # initdb/pg_ctl. The runner image ships PostgreSQL, but not on PATH.
      - name: Put PostgreSQL binaries on PATH
        run: ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and database tests
        run: npm test

      - name: SEO metadata check
        run: npm run check:seo

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Journey tests drive the dashboard in Chromium against the local build.
      # Supabase and every API call are intercepted, so nothing leaves the runner.
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser journey tests
        run: |
          npm start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npm run test:browser
        env:
          APPLICATIONS_BROWSER_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: 1

      - name: Server log on failure
        if: failure()
        run: tail -n 100 /tmp/next.log || true
